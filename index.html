<!DOCTYPE html>
<html>
<head>
<title>Exam Login</title>
<link rel="stylesheet" href="css/style.css">

<style>

/* ===== FULL PAGE CENTER ===== */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e9ecef;
    font-family:Arial, Helvetica, sans-serif;
}

/* ===== LOGIN CARD ===== */
.exam-login-card{
    background:#a8d0cc;
    padding:40px 35px;
    width:340px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    text-align:center;
}

/* TITLE */
.exam-login-card h2{
    margin-bottom:30px;
    text-decoration:underline;
}

/* INPUTS */
.exam-login-card input{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border-radius:10px;
    border:1px solid #7daaa6;
    outline:none;
    font-size:14px;
    transition:0.2s;
}

.exam-login-card input:focus{
    border-color:#2a80d7;
    box-shadow:0 0 0 2px rgba(42,128,215,0.2);
}

/* BUTTON */
.exam-login-card button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#38d6c4;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.exam-login-card button:hover{
    background:#1fb5a3;
}

</style>
</head>

<body>

<div class="exam-login-card">
    <h2>Exam Login</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="phone" placeholder="Phone Number">

    <button onclick="startExam()">Start Exam</button>
</div>

<script src="js/config.js"></script>

<script>

async function startExam(){

    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();

    if(name === "" || phone === ""){
        alert("Enter details!");
        return;
    }

    const res = await fetch(SCRIPT_URL + "?mode=student");
    const config = await res.json();

    if(!config.enabled){
        alert("Exam is not enabled.");
        return;
    }

    if(!config.startTime){
        alert("Exam is not scheduled.");
        return;
    }

    const start = new Date(config.startTime);
    const end = new Date(start.getTime() + config.duration * 60000);
    const now = new Date();

    if(now < start){
        alert("Exam has not started yet.");
        return;
    }

    if(now > end){
        alert("Exam time is over.");
        return;
    }

    localStorage.setItem("name", name);
    localStorage.setItem("phone", phone);
    localStorage.setItem("passMark", config.passMark);
    localStorage.setItem("duration", config.duration);
    localStorage.setItem("startTime", config.startTime);

    window.location.href = "test.html";
}

</script>

</body>
</html>
