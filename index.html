<!DOCTYPE html>
<html>
<head>
<title>Exam Login</title>
<link rel="stylesheet" href="css/style.css">

<style>

/* ===== FULL PAGE CENTER ===== */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e9ecef;
    font-family:Arial, Helvetica, sans-serif;
}

/* ===== LOGIN CARD ===== */
.exam-login-card{
    background:#a8d0cc;
    padding:40px 35px;
    width:340px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    text-align:center;
}

/* TITLE */
.exam-login-card h2{
    margin-bottom:30px;
    text-decoration:underline;
}

/* INPUTS */
.exam-login-card input{
    width:92%;
    padding:12px;
    margin-bottom:18px;
    border-radius:10px;
    border:1px solid #7daaa6;
    outline:none;
    font-size:14px;
    transition:0.2s;
}

.exam-login-card input:focus{
    border-color:#2a80d7;
    box-shadow:0 0 0 2px rgba(42,128,215,0.2);
}

/* BUTTON */
.exam-login-card button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#38d6c4;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.exam-login-card button:hover{
    background:#1fb5a3;
}

</style>
</head>

<body>

<div class="exam-login-card">
    <h2>Exam Login</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="tel"
       id="phone"
       maxlength="10"
       pattern="[0-9]{10}"
       inputmode="numeric"
       oninput="this.value=this.value.replace(/[^0-9]/g,'')"
       placeholder="Phone Number"
       required>
    <input type="text" id="sessionInput" placeholder="Session ID">
    
    <button onclick="startExam()">Start Exam</button>
</div>

<script src="js/config.js"></script>

<script>

async function startExam(){

    const nameInput  = document.getElementById("name");
    const phoneInput = document.getElementById("phone");
    const sessionInput = document.getElementById("sessionId");

    if(!nameInput || !phoneInput || !sessionInput){
        alert("Form error. Contact admin.");
        return;
    }

    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    const sessionId = sessionInput.value.trim();

    if(!name || !phone || !sessionId){
        alert("Please fill all fields");
        return;
    }

    if(!/^[0-9]{10}$/.test(phone)){
        alert("Enter valid 10 digit phone number");
        return;
    }

    try{

        const res = await fetch(SCRIPT_URL + "?mode=student");
        const config = await res.json();

        if(!config.enabled){
            alert("Exam not enabled.");
            return;
        }

        if(sessionId !== config.sessionId){
            alert("Invalid Session ID");
            return;
        }

        // Save candidate info
        localStorage.setItem("name", name);
        localStorage.setItem("phone", phone);

        window.location.href = "test.html";

    }catch(err){
        alert("Unable to verify exam.");
        console.log(err);
    }

}

</script>


</body>
</html>
