<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embedded Systems Exam — Login</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { background: var(--bg); }
.login-bg {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: linear-gradient(135deg, #0f2942 0%, #1a3a5c 50%, #0d1f30 100%);
  position: relative;
  overflow: hidden;
}
.login-bg::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(0,200,150,0.08) 0%, transparent 70%);
  top: -100px; right: -100px;
  border-radius: 50%;
}
.login-bg::after {
  content: '';
  position: absolute;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(59,158,255,0.06) 0%, transparent 70%);
  bottom: -50px; left: -50px;
  border-radius: 50%;
}
.login-card {
  background: rgba(28,35,51,0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 48px 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  z-index: 1;
  animation: fadeUp 0.6s ease;
}
.login-logo {
  width: 60px; height: 60px;
  background: linear-gradient(135deg, #00c896, #00a0d0);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin: 0 auto 20px;
  box-shadow: 0 8px 24px rgba(0,200,150,0.3);
}
.login-card h1 {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  color: #e6edf3;
  margin-bottom: 4px;
}
.login-card p.sub {
  text-align: center;
  font-size: 13px;
  color: #6e7681;
  margin-bottom: 32px;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: #8b949e;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05);
  color: #e6edf3;
  font-family: 'Sora', sans-serif;
  font-size: 14px;
  outline: none;
  transition: all 0.25s;
  box-sizing: border-box;
}
.field input:focus {
  border-color: #00c896;
  background: rgba(0,200,150,0.06);
  box-shadow: 0 0 0 3px rgba(0,200,150,0.15);
}
.field input::placeholder { color: #4a5568; }
.start-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #00c896, #00a0d0);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Sora', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.25s;
  box-shadow: 0 6px 20px rgba(0,200,150,0.3);
}
.start-btn:hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,200,150,0.4); }
.start-btn:active { transform: translateY(0); }
.notice-box {
  margin-top: 20px;
  padding: 12px 16px;
  background: rgba(255,193,7,0.08);
  border: 1px solid rgba(255,193,7,0.2);
  border-radius: 8px;
  font-size: 12px;
  color: #ffc107;
  text-align: center;
  line-height: 1.6;
}
.dm-toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50px;
  padding: 7px 14px;
  cursor: pointer;
  color: #e6edf3;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 9999;
  transition: all 0.25s;
  font-family: 'Sora', sans-serif;
}
.dm-toggle:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<button class="dm-toggle" onclick="toggleTheme()">
  <span id="themeIcon">🌙</span><span id="themeLabel">Dark</span>
</button>

<div class="login-bg">
  <div class="login-card">
    <div class="login-logo">💻</div>
    <h1>Technical Assessment</h1>
    <p class="sub">Embedded Systems & C Programming</p>

    <div class="field">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" autocomplete="off">
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    </div>
    <div class="field">
      <label>Session ID</label>
      <input type="text" id="sessionInput" placeholder="Enter session ID from admin" autocomplete="off">
    </div>

    <button class="start-btn" onclick="startExam()">Start Exam →</button>

    <div class="notice-box">
      ⚠️ Once started, do not switch tabs or exit fullscreen — this will trigger an alert.
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
// Theme
const saved = localStorage.getItem('theme') || 'dark';
if(saved === 'light'){
  document.documentElement.setAttribute('data-theme','light');
  document.getElementById('themeIcon').textContent = '☀️';
  document.getElementById('themeLabel').textContent = 'Light';
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('themeIcon').textContent = next === 'dark' ? '🌙' : '☀️';
  document.getElementById('themeLabel').textContent = next === 'dark' ? 'Dark' : 'Light';
}

async function startExam(){
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const sessionId = document.getElementById('sessionInput').value.trim();

  if(!name || !phone || !sessionId){
    alert('Please fill all fields.');
    return;
  }
  if(!/^[0-9]{10}$/.test(phone)){
    alert('Enter a valid 10-digit phone number.');
    return;
  }

  const btn = document.querySelector('.start-btn');
  btn.textContent = 'Verifying...';
  btn.disabled = true;

  try {
    const res = await fetch(SCRIPT_URL + '?mode=student&sessionId=' + encodeURIComponent(sessionId));
    const config = await res.json();

    if(config.error || !config.enabled){
      alert('Exam is not active or Session ID is invalid. Please check with admin.');
      btn.textContent = 'Start Exam →'; btn.disabled = false;
      return;
    }

    // Validate session ID (what candidate typed) against candidateCode from server
    if(sessionId !== config.sessionId){
      alert('Invalid Session ID. Please check with admin.');
      btn.textContent = 'Start Exam →'; btn.disabled = false;
      return;
    }

    // ── Exam window check: block entry if exam time has passed ──
    if(config.startTime && config.duration){
      const start = new Date(config.startTime).getTime();
      const end   = start + Number(config.duration) * 60000;
      const now   = Date.now();
      if(now < start){
        const mins = Math.ceil((start - now) / 60000);
        alert('Exam has not started yet. It begins in ' + mins + ' minute(s).');
        btn.textContent = 'Start Exam →'; btn.disabled = false;
        return;
      }
      if(now > end){
        alert('The exam window has closed. You can no longer enter.');
        btn.textContent = 'Start Exam →'; btn.disabled = false;
        return;
      }
    }

    // Wipe stale exam state
    localStorage.removeItem('examSubmittedFlag');
    localStorage.removeItem('examEndTime');
    localStorage.removeItem('score');
    localStorage.removeItem('result');
    localStorage.removeItem('sectionBreakdown');

    localStorage.setItem('name', name);
    localStorage.setItem('phone', phone);
    localStorage.setItem('passMark', config.passMark);
    // Store internalId (used by test.js to POST result to correct sheet)
    localStorage.setItem('examSessionId', config.internalId || config.sessionId);
    // Use remaining time from exam window, not full duration, in case candidate logs in late
    const start2 = config.startTime ? new Date(config.startTime).getTime() : Date.now();
    const examEnd = start2 + Number(config.duration) * 60000;
    localStorage.setItem('examEndTime', String(examEnd));

    window.location.href = 'test.html';
  } catch(err) {
    alert('Unable to connect. Check your internet connection.');
    btn.textContent = 'Start Exam →'; btn.disabled = false;
  }
}

document.addEventListener('keydown', e => {
  if(e.key === 'Enter') startExam();
});
</script>
</body>
</html>
