<!DOCTYPE html>
<html>
<head>
<title>Start Exam</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
<h2>Online Exam</h2>

<input type="text" id="name" placeholder="Full Name"><br><br>
<input type="text" id="phone" placeholder="Phone Number"><br><br>

<button onclick="startExam()">Start Exam</button>
</div>

<script src="js/config.js"></script>

<script>

async function startExam(){

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;

    if(name === "" || phone === ""){
        alert("Enter details!");
        return;
    }

    const res = await fetch(SCRIPT_URL + "?mode=student");
    const config = await res.json();

    if(!config.enabled){
        alert("Exam is not enabled.");
        return;
    }

    if(!config.startTime){
        alert("Exam is not scheduled.");
        return;
    }

    const start = new Date(config.startTime);
    const end = new Date(start.getTime() + config.duration * 60000);
    const now = new Date();

    if(now < start){
        alert("Exam has not started yet.");
        return;
    }

    if(now > end){
        alert("Exam time is over.");
        return;
    }

    localStorage.setItem("name", name);
    localStorage.setItem("phone", phone);
    localStorage.setItem("passMark", config.passMark);

    window.location.href = "test.html";
}

</script>

</body>
</html>
