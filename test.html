<!DOCTYPE html>
<html>
<head>
<title>Exam</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body class="exam-theme">

<div class="exam-wrapper">

    <!-- HEADER -->
    <div class="exam-header">
        <h2>Q&A</h2>
        <div class="timer-box">
            Time Left : <span id="timer"></span>
        </div>
    </div>

    <!-- QUESTIONS -->
    <div id="mcqSection" class="question-container"></div>

    <!-- SUBMIT -->
    <div class="submit-container">
        <button class="submit-btn" onclick="submitTest()">
            Submit Exam
        </button>
    </div>

</div>

<script src="js/config.js"></script>
<script src="js/questions.js"></script>
<script src="js/test.js"></script>
<script src="js/timer.js"></script>

<script>
renderMCQ();

/* ================= ANTI CHEAT SYSTEM ================= */

/* ---------------- FULLSCREEN ON FIRST CLICK ---------------- */
document.addEventListener("click", function startExamOnce() {
    document.removeEventListener("click", startExamOnce);

    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    }
});

/* ------------- EXIT FULLSCREEN = AUTO SUBMIT ------------- */
document.addEventListener("fullscreenchange", function () {
    if (!document.fullscreenElement) {
        alert("Fullscreen exited. Exam will be submitted.");
        forceSubmit();
    }
});

/* ------------- TAB SWITCH / MINIMIZE DETECTION ------------- */
let violationCount = 0;

function handleViolation(reason) {
    violationCount++;
    alert(reason);

    if (violationCount >= 1) {
        forceSubmit();
    }
}

document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
        handleViolation("Tab switch detected. Exam submitted.");
    }
});

window.addEventListener("blur", function () {
    handleViolation("Window lost focus. Exam submitted.");
});

/* ------------- DISABLE RIGHT CLICK ------------- */
document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
});

/* ------------- DISABLE DEVTOOLS SHORTCUTS ------------- */
document.addEventListener("keydown", function (e) {

    if (e.key === "F12") e.preventDefault();

    if (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) {
        e.preventDefault();
    }

    if (e.ctrlKey && e.key === "u") {
        e.preventDefault();
    }
});

/* ------------- DISABLE COPY PASTE ------------- */
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("cut", e => e.preventDefault());
document.addEventListener("paste", e => e.preventDefault());

/* ------------- PREVENT BACK BUTTON ------------- */
history.pushState(null, null, location.href);
window.onpopstate = function () {
    history.go(1);
};

/* ------------- FORCE SUBMIT FUNCTION ------------- */
function forceSubmit() {

    if (!window.examAlreadySubmitted) {
        window.examAlreadySubmitted = true;

        submitTest();   // calls your existing submit function

        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}
</script>

</body>
</html>
