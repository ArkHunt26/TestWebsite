<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam — Technical Assessment</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* Fix 3: Custom non-blocking anti-cheat overlay (replaces browser confirm) */
#antiCheatOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 9999;
  align-items: center;
  justify-content: center;
}
#antiCheatOverlay.show { display: flex; }
.anti-cheat-box {
  background: var(--surface);
  border: 2px solid var(--danger);
  border-radius: 20px;
  padding: 36px 32px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(255,77,109,0.3);
  animation: fadeUp 0.3s ease;
}
.anti-cheat-box .ac-icon { font-size: 52px; margin-bottom: 12px; }
.anti-cheat-box h3 { font-size: 20px; font-weight: 700; color: var(--danger); margin-bottom: 8px; }
.anti-cheat-box p { font-size: 14px; color: var(--text2); margin-bottom: 24px; line-height: 1.6; }
.anti-cheat-box .ac-btns { display: flex; gap: 12px; justify-content: center; }
.ac-btn-return {
  padding: 11px 24px; background: var(--accent); color: #fff;
  border: none; border-radius: 10px; font-family: 'Sora',sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.ac-btn-return:hover { filter: brightness(1.1); }
.ac-btn-submit {
  padding: 11px 24px; background: transparent; color: var(--danger);
  border: 2px solid var(--danger); border-radius: 10px;
  font-family: 'Sora',sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.ac-btn-submit:hover { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<div class="exam-topbar">
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-size:18px;">💻</span>
    <span style="font-weight:700;color:#fff;font-size:15px;">Technical Assessment</span>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <span id="candidateName" style="font-size:13px;color:rgba(255,255,255,0.7);"></span>
    <div class="timer-display" id="timer">--:--</div>
  </div>
</div>

<div class="exam-content">
  <div id="mcqSection"></div>
</div>

<div class="submit-bar">
  <span style="font-size:13px;color:var(--text3);">Complete all sections before submitting</span>
  <button class="submit-exam-btn" onclick="confirmSubmit()">Submit Exam ✓</button>
</div>

<!-- Submit Confirm Modal -->
<div id="confirmModal" class="modal-overlay hidden">
  <div class="modal" style="max-width:400px;text-align:center;">
    <div style="font-size:48px;margin-bottom:16px;">📋</div>
    <h3 style="margin-bottom:8px;font-size:20px;">Submit Exam?</h3>
    <p style="color:var(--text3);margin-bottom:28px;font-size:14px;">Once submitted, you cannot go back. Make sure you've answered all questions.</p>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="btn-secondary" onclick="closeConfirm()">Go Back</button>
      <button class="btn-primary" style="width:auto;padding:12px 28px;" onclick="submitTest(false)">Yes, Submit</button>
    </div>
  </div>
</div>

<!-- Fix 3: Non-blocking anti-cheat overlay -->
<div id="antiCheatOverlay">
  <div class="anti-cheat-box">
    <div class="ac-icon">⚠️</div>
    <h3 id="acTitle">Warning</h3>
    <p id="acMessage">Please return to the exam.</p>
    <div class="ac-btns">
      <button class="ac-btn-return" onclick="acReturn()">↩ Return to Exam</button>
      <button class="ac-btn-submit" onclick="acSubmit()">Submit Now</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/questions.js"></script>
<script src="js/test.js"></script>
<script src="js/timer.js"></script>

<script>
// ── Theme ──
const t = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', t);

// ── Tab key → 4 spaces in code editor ──
document.addEventListener('keydown', function(e){
  if(e.key === 'Tab' && e.target.tagName === 'TEXTAREA'){
    e.preventDefault();
    const ta = e.target, s = ta.selectionStart;
    ta.value = ta.value.substring(0,s) + '    ' + ta.value.substring(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + 4;
  }
  // Block Escape from exiting fullscreen
  if(e.key === 'Escape' && !examSubmitted){ e.preventDefault(); e.stopPropagation(); }
}, true);

// ── Anti-cheat overlay ──
let _overlayOpen = false;

function showAntiCheat(title, message){
  if(examSubmitted || _overlayOpen) return;
  _overlayOpen = true;
  document.getElementById('acTitle').textContent = title;
  document.getElementById('acMessage').textContent = message;
  document.getElementById('antiCheatOverlay').classList.add('show');
}

function acReturn(){
  _overlayOpen = false;
  document.getElementById('antiCheatOverlay').classList.remove('show');
  // Mark that the NEXT fullscreen change is us doing it intentionally
  _expectingFsChange = true;
  document.documentElement.requestFullscreen().catch(() => { _expectingFsChange = false; });
}

function acSubmit(){
  _overlayOpen = false;
  document.getElementById('antiCheatOverlay').classList.remove('show');
  submitTest(true);
}

// Route test.js cheatPopup calls through our overlay
window._customCheatPopup = function(reason){
  if(examSubmitted || _overlayOpen) return;
  const map = {
    '⚠️ Fullscreen exited!':       ['Fullscreen Required',   'You exited fullscreen mode. Click "Return to Exam" to continue.'],
    '⚠️ Tab switch detected!':      ['Tab Switch Detected',   'Switching tabs is not allowed during the exam.'],
    '⚠️ Back navigation detected!': ['Navigation Blocked',    'Back navigation is not allowed during an active exam.']
  };
  const [title, msg] = map[reason] || ['Warning', reason];
  showAntiCheat(title, msg);
};

// ── Back button block ──
history.pushState({ page: 'exam' }, '', '');
window.addEventListener('popstate', function(){
  if(!examSubmitted){
    history.pushState({ page: 'exam' }, '', '');
    window._customCheatPopup('⚠️ Back navigation detected!');
  }
});

// ── Submit confirmation modal ──
function confirmSubmit(){
  document.getElementById('confirmModal').classList.remove('hidden');
}
function closeConfirm(){
  document.getElementById('confirmModal').classList.add('hidden');
}

// ── Patch submitTest to set localStorage flag first ──
const _origSubmit = submitTest;
window.submitTest = async function(fromCheat){
  localStorage.setItem('examSubmittedFlag', '1');
  localStorage.removeItem('examEndTime');
  await _origSubmit(fromCheat);
};

// ── Silent fullscreen enforcement ──
// Only show popup if browser truly can't re-enter fullscreen
// (not while overlay is open or exam submitted)
let _fsEnforcerActive = false;
setInterval(function(){
  if(examSubmitted || _overlayOpen || _fsEnforcerActive) return;
  if(!document.fullscreenElement){
    _fsEnforcerActive = true;
    _expectingFsChange = true;
    document.documentElement.requestFullscreen()
      .then(() => { _fsEnforcerActive = false; })
      .catch(() => {
        _expectingFsChange = false;
        _fsEnforcerActive = false;
        // Only show overlay if not already open
        if(!_overlayOpen){
          showAntiCheat('Fullscreen Required', 'Please click "Return to Exam" to re-enter fullscreen and continue.');
        }
      });
  }
}, 4000); // 4s to avoid rapid retries

// ── Init on load ──
window.onload = function(){
  const name = localStorage.getItem('name');
  if(!name){ window.location.replace('index.html'); return; }

  // Guard: redirect back to result if exam already submitted
  const endTime  = parseInt(localStorage.getItem('examEndTime') || '0');
  const submitted = localStorage.getItem('examSubmittedFlag');
  if(submitted === '1' || (endTime > 0 && Date.now() > endTime + 5000)){
    window.location.replace('result.html');
    return;
  }

  document.getElementById('candidateName').textContent = '👤 ' + name;
  renderMCQ();
  initExamTimer();
  // Enter fullscreen after render
  setTimeout(() => {
    _expectingFsChange = true;
    enterFullscreen();
  }, 600);
};
</script>

</body>
</html>
