<!DOCTYPE html>
<html>
<head>
<title>Admin</title>

<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="admin-theme">

<div class="admin-wrapper">

<h2>Admin Dashboard</h2>

<!-- LOGIN -->
<div id="loginBox">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="panel" style="display:none">

<div class="admin-grid">

    <!-- LEFT : DETAILS -->
    <div class="admin-card">
        <h3>Exam details</h3>

        <p>Total Candidates : <span id="total"></span></p>
        <p>Total Pass Candidates : <span id="passed"></span></p>
        <p>Total Failed Candidates : <span id="failed"></span></p>

        <!-- FIXED CANVAS SIZE (Prevents Blur) -->
        <canvas id="chart" width="240" height="240"></canvas>
    </div>

    <!-- RIGHT : SETTINGS -->
    <div class="admin-card">
        <h3>Exam Settings</h3>

        <div class="form-row">
            <label>Start Time</label>
            <input type="datetime-local" id="start">
        </div>

        <div class="form-row">
            <label>Duration (min)</label>
            <input type="number" id="duration" min="30">
        </div>

        <div class="form-row">
            <label>Pass Mark</label>
            <input type="number" id="passMark">
        </div>

        <div class="form-row">
            <label>Enable Exam</label>
            <input type="checkbox" id="enabled">
        </div>

        <button onclick="update()">Update Settings</button>
    </div>

</div>

<!-- STATUS BAR -->
<div class="admin-status">
    <span>Exam status</span>
    <div id="statusLight" class="admin-light"></div>
    <button onclick="download()">Download Excel</button>
</div>

</div>
</div>

<script src="js/config.js"></script>

<script>
let password="";
let chartInstance=null;

function login(){
password=document.getElementById("pass").value;

fetch(SCRIPT_URL+"?mode=admin&password="+password)
.then(r=>r.json())
.then(d=>{

if(d.error){ alert("Wrong Password"); return; }

document.getElementById("loginBox").style.display="none";
document.getElementById("panel").style.display="block";

total.innerText=d.totalCandidates;
passed.innerText=d.passedCount;
failed.innerText=d.failedCount;

/* DESTROY OLD CHART */
if(chartInstance) chartInstance.destroy();

/* FINAL PIE CHART (NO LEGEND, NO BLUR) */
chartInstance = new Chart(document.getElementById("chart"), {
type: "pie",
data: {
labels: ["Pass","Fail"],
datasets: [{
data: [d.passedCount, d.failedCount],
backgroundColor: ["#66ff00","#ff2b2b"],
borderWidth: 1
}]

},

options: {
responsive: false,
maintainAspectRatio: true,
devicePixelRatio: window.devicePixelRatio,   // ⭐ ensures crisp rendering

plugins: {
legend: { display: false },
tooltip: { enabled: true }
}
}


});

/* LOAD SETTINGS */
duration.value=d.duration;
passMark.value=d.passMark;
enabled.checked=d.enabled;

if(d.startTime){
const dt=new Date(d.startTime);
if(!isNaN(dt)){
start.value=dt.toISOString().slice(0,16);
}
}

updateStatusLight(d);
});
}

/* STATUS COLOR */
function updateStatusLight(data){
const light=document.getElementById("statusLight");

if(!data.enabled || !data.startTime){
light.style.background="#9e9e9e"; return;
}

const now=new Date();
const start=new Date(data.startTime);
const end=new Date(start.getTime()+data.duration*60000);

if(now<start) light.style.background="#9e9e9e";
else if(now>=start && now<=end) light.style.background="#ff2b2b";
else light.style.background="#66ff00";
}


function update(){

    const formData = new URLSearchParams();
    formData.append("type","UPDATE_CONFIG");
    formData.append("password",password);
    formData.append("duration",duration.value);
    formData.append("startTime",start.value);
    formData.append("enabled",enabled.checked);
    formData.append("passMark",passMark.value);

    fetch(SCRIPT_URL,{
        method:"POST",
        body:formData
    })
    .then(r=>r.text())
    .then(()=>{
        alert("Settings Updated");
    })
    .catch(err=>{
        console.log("Update error:",err);
    });
}

window.open("YOUR_SHEET_LINK");
}

document.getElementById("pass").addEventListener("keypress",e=>{
if(e.key==="Enter") login();
});

function autoRefresh(){

    if(!password) return;

    fetch(SCRIPT_URL + "?mode=admin&password=" + password)
    .then(r=>r.json())
    .then(d=>{

        if(d.error) return;

        document.getElementById("total").innerText = d.totalCandidates;
        document.getElementById("passed").innerText = d.passedCount;
        document.getElementById("failed").innerText = d.failedCount;

        updateStatusLight(d);

        if(chartInstance){
            chartInstance.data.datasets[0].data =
                [d.passedCount, d.failedCount];
            chartInstance.update();
        }
    })
    .catch(err=>{
        console.log("Auto refresh error:", err);
    });
}

/* Start live refresh AFTER login */
function startLiveUpdates(){
    setInterval(autoRefresh, 2000);
}
