<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

<h2>Admin Dashboard</h2>

<!-- LOGIN -->
<div id="loginBox">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="panel" style="display:none">

<div class="dashboard-grid">

    <!-- LEFT : STATS -->
    <div class="card stats-card">
        <h3>Total: <span id="total"></span></h3>
        <h3>Passed: <span id="passed"></span></h3>
        <h3>Failed: <span id="failed"></span></h3>

        <canvas id="chart"></canvas>
    </div>

    <!-- RIGHT TOP : SETTINGS -->
    <div class="card settings-card">
        <h3>Exam Settings</h3>

        <div class="form-row">
            <label>Start Time</label>
            <input type="datetime-local" id="start">
        </div>

        <div class="form-row">
            <label>Duration (min)</label>
            <input type="number" id="duration" min="30" placeholder="Enter minutes (e.g., 45)">
        </div>

        <div class="form-row">
            <label>Pass Mark</label>
            <input type="number" id="passMark">
        </div>

        <div class="form-row">
            <label>Enable Exam</label>
            <input type="checkbox" id="enabled">
        </div>

        <button onclick="update()">Update Settings</button>
    </div>

    <!-- RIGHT BOTTOM : STATUS -->
    <div class="card status-card">
        <div class="status-row">
            <span>Exam status</span>
            <div class="status-indicator" id="statusLight"></div>
        </div>

        <button onclick="download()">Download Excel</button>
    </div>

</div>
</div>
</div>

<script src="js/config.js"></script>

<script>
let password="";
let chartInstance=null;

function login(){
password=document.getElementById("pass").value;

fetch(SCRIPT_URL+"?mode=admin&password="+password)
.then(r=>r.json())
.then(d=>{

if(d.error){
    alert("Wrong Password");
    return;
}

document.getElementById("loginBox").style.display="none";
document.getElementById("panel").style.display="block";

document.getElementById("total").innerText=d.totalCandidates;
document.getElementById("passed").innerText=d.passedCount;
document.getElementById("failed").innerText=d.failedCount;

if(chartInstance) chartInstance.destroy();

chartInstance=new Chart(document.getElementById("chart"),{
type:"pie",
data:{
labels:["Pass","Fail"],
datasets:[{
data:[d.passedCount,d.failedCount],
backgroundColor:["#4CAF50","#F44336"]
}]
}
});

document.getElementById("duration").value=d.duration;
document.getElementById("passMark").value=d.passMark;
document.getElementById("enabled").checked=d.enabled;

if(d.startTime){
const dt=new Date(d.startTime);
if(!isNaN(dt)){
document.getElementById("start").value=dt.toISOString().slice(0,16);
}
}

/* STATUS LIGHT */
document.getElementById("statusLight").style.background =
d.enabled ? "green" : "red";

});
}

function update(){

const dur=parseInt(duration.value);

if(isNaN(dur) || dur<30){
alert("Duration must be at least 30 minutes");
return;
}

fetch(SCRIPT_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
type:"UPDATE_CONFIG",
password:password,
duration:dur,
startTime:start.value,
enabled:enabled.checked,
passMark:passMark.value
})
}).then(()=>alert("Settings Updated"));
}

function download(){
window.open("https://docs.google.com/spreadsheets/d/1PYDJPxUnHa13L6IAPacDLE5gZwKneBZWeUqwm-m1t4g/edit?usp=sharing");
}

document.addEventListener("DOMContentLoaded",()=>{
document.getElementById("pass").addEventListener("keypress",function(e){
if(e.key==="Enter") login();
});
});
</script>

</body>
</html>
