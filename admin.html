<!DOCTYPE html>
<html>
<head>
<title>Admin</title>

<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="admin-theme">

<!-- =========================
     LOGIN CARD (NEW UI)
========================= -->
<div id="loginContainer" class="login-container">

    <div class="login-card">
        <h2>Admin Dashboard</h2>

        <input type="password" id="pass"
               placeholder="Enter password">

        <button onclick="login()">Login</button>
    </div>

</div>



<!-- =========================
     DASHBOARD (UNCHANGED)
========================= -->
<div id="dashboardContainer"
     class="admin-wrapper"
     style="display:none;">

<h2>Admin Dashboard</h2>

<div class="admin-grid">

    <!-- LEFT : DETAILS -->
    <div class="admin-card">
        <h3>Exam details</h3>

        <p>Total Candidates :
            <span id="total">0</span></p>
        <p>Total Pass Candidates :
            <span id="passed">0</span></p>
        <p>Total Failed Candidates :
            <span id="failed">0</span></p>

        <canvas id="chart"
                width="240"
                height="240"></canvas>
    </div>

    <!-- RIGHT : SETTINGS -->
    <div class="admin-card">
        <h3>Exam Settings</h3>

        <div class="form-row">
            <label>Start Time</label>
            <input type="datetime-local" id="start">
        </div>

        <div class="form-row">
            <label>Duration (min)</label>
            <input type="number"
                   id="duration"
                   min="1">
        </div>

        <div class="form-row">
            <label>Pass Mark</label>
            <input type="number"
                   id="passMark">
        </div>

        <div class="form-row">
            <label>Enable Exam</label>
            <input type="checkbox"
                   id="enabled">
        </div>

        <button onclick="update()">
            Update Settings
        </button>
    </div>

</div>

<!-- STATUS BAR -->
<div class="admin-status">
    <span>Exam status</span>
    <div id="statusLight"
         class="admin-light"></div>
    <button onclick="download()">
        Download Excel
    </button>
</div>

</div>



<script src="js/config.js"></script>

<script>

let password = "";
let chartInstance = null;
let refreshInterval = null;
let settingsLoadedOnce = false;


/* =========================
   LOGIN
========================= */
function login(){

    password = document.getElementById("pass").value;

    fetch(SCRIPT_URL + "?mode=admin&password=" + password)
    .then(r => r.json())
    .then(d => {

        if(d.error){
            alert("Wrong Password");
            return;
        }

        document.getElementById("loginContainer")
            .style.display = "none";

        document.getElementById("dashboardContainer")
            .style.display = "block";

        loadDashboard();

        if(refreshInterval)
            clearInterval(refreshInterval);

        refreshInterval =
            setInterval(loadDashboard, 3000);
    });
}



/* =========================
   LOAD DASHBOARD
========================= */
function loadDashboard(){

    fetch(SCRIPT_URL +
          "?mode=admin&password=" + password)
    .then(r => r.json())
    .then(d => {

        if(d.error){
            clearInterval(refreshInterval);
            alert("Session expired.");
            location.reload();
            return;
        }

        total.innerText  = d.totalCandidates;
        passed.innerText = d.passedCount;
        failed.innerText = d.failedCount;

        if(chartInstance){
            chartInstance.data.datasets[0].data =
                [d.passedCount, d.failedCount];
            chartInstance.update();
        }
        else{
            chartInstance =
                new Chart(document.getElementById("chart"),{
                    type:"pie",
                    data:{
                        labels:["Pass","Fail"],
                        datasets:[{
                            data:[d.passedCount,
                                  d.failedCount],
                            backgroundColor:[
                                "#66ff00",
                                "#ff2b2b"]
                        }]
                    },
                    options:{
                        responsive:false,
                        plugins:{
                            legend:{display:false}
                        }
                    }
                });
        }

        updateStatusLight(d);
    });
}



/* =========================
   STATUS LIGHT
========================= */
function updateStatusLight(data){

    const light =
        document.getElementById("statusLight");

    if(!data.enabled ||
       !data.startTime ||
       !data.duration){
        light.style.background="#9e9e9e";
        return;
    }

    const now   = new Date();
    const start = new Date(data.startTime);
    const end   = new Date(
        start.getTime() +
        data.duration * 60000);

    if(now < start)
        light.style.background="#9e9e9e";
    else if(now <= end)
        light.style.background="#66ff00";
    else
        light.style.background="#ff2b2b";
}



/* =========================
   UPDATE SETTINGS
========================= */
function update(){

    const formData =
        new URLSearchParams();

    formData.append("type","UPDATE_CONFIG");
    formData.append("password",password);
    formData.append("duration",duration.value);
    formData.append("startTime",start.value);
    formData.append("enabled",enabled.checked);
    formData.append("passMark",passMark.value);

    fetch(SCRIPT_URL,{
        method:"POST",
        body:formData
    })
    .then(()=>loadDashboard());
}



function download(){
    const fileId =
    "1PYDJPxUnHa13L6IAPacDLE5gZwKneBZWeUqwm-m1t4g";

    window.open(
      `https://docs.google.com/spreadsheets/d/${fileId}/export?format=xlsx`
    );
}



document.getElementById("pass")
.addEventListener("keypress",e=>{
    if(e.key==="Enter") login();
});

</script>

</body>
</html>
