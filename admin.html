<!DOCTYPE html>
<html>
<head>
<title>Admin</title>

<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="admin-theme">

<div class="admin-wrapper">

<h2>Admin Dashboard</h2>

<!-- LOGIN -->
<div id="loginBox">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="panel" style="display:none">

<div class="admin-grid">

    <!-- LEFT : DETAILS -->
    <div class="admin-card">
        <h3>Exam details</h3>

        <p>Total Candidates : <span id="total">0</span></p>
        <p>Total Pass Candidates : <span id="passed">0</span></p>
        <p>Total Failed Candidates : <span id="failed">0</span></p>

        <canvas id="chart" width="240" height="240"></canvas>
    </div>

    <!-- RIGHT : SETTINGS -->
    <div class="admin-card">
        <h3>Exam Settings</h3>

        <div class="form-row">
            <label>Start Time</label>
            <input type="datetime-local" id="start">
        </div>

        <div class="form-row">
            <label>Duration (min)</label>
            <input type="number" id="duration" min="1">
        </div>

        <div class="form-row">
            <label>Pass Mark</label>
            <input type="number" id="passMark">
        </div>

        <div class="form-row">
            <label>Enable Exam</label>
            <input type="checkbox" id="enabled">
        </div>

        <button onclick="update()">Update Settings</button>
    </div>

</div>

<!-- STATUS BAR -->
<div class="admin-status">
    <span>Exam status</span>
    <div id="statusLight" class="admin-light"></div>
    <button onclick="download()">Download Excel</button>
</div>

</div>
</div>

<script src="js/config.js"></script>

<script>

let password = "";
let chartInstance = null;
let refreshInterval = null;
let settingsLoadedOnce = false;


/* ============================
   LOAD DASHBOARD
============================ */
function loadDashboard(){

    if(!password) return;

    fetch(SCRIPT_URL + "?mode=admin&password=" + password)
    .then(r => r.json())
    .then(d => {

        if(d.error){
            clearInterval(refreshInterval);
            alert("Session expired. Login again.");
            location.reload();
            return;
        }

        /* ===== UPDATE NUMBERS ===== */
        total.innerText  = d.totalCandidates;
        passed.innerText = d.passedCount;
        failed.innerText = d.failedCount;

        /* ===== UPDATE CHART ===== */
        if(chartInstance){
            chartInstance.data.datasets[0].data =
                [d.passedCount, d.failedCount];
            chartInstance.update();
        } else {

            chartInstance = new Chart(document.getElementById("chart"),{
                type:"pie",
                data:{
                    labels:["Pass","Fail"],
                    datasets:[{
                        data:[d.passedCount,d.failedCount],
                        backgroundColor:["#66ff00","#ff2b2b"]
                    }]
                },
                options:{
                    responsive:false,
                    plugins:{
                        legend:{display:false},
                        tooltip:{
                            callbacks:{
                                label:function(context){
                                    const total =
                                        context.dataset.data
                                        .reduce((a,b)=>a+b,0);

                                    const value = context.raw;
                                    const percentage =
                                        total ? 
                                        ((value/total)*100)
                                        .toFixed(1) : 0;

                                    return context.label +
                                        " – " + percentage + "%";
                                }
                            }
                        }
                    }
                }
            });
        }

        /* ===== LOAD SETTINGS ONLY ONCE ===== */
        if(!settingsLoadedOnce){

            document.getElementById("duration").value = d.duration || "";
            document.getElementById("passMark").value = d.passMark || "";
            document.getElementById("enabled").checked = d.enabled === true;

            const startInput = document.getElementById("start");

            if(d.startTime && d.startTime !== ""){

                const dt = new Date(d.startTime);

                if(!isNaN(dt)){
                    const offset = dt.getTimezoneOffset();
                    const local = new Date(dt.getTime() - offset * 60000);
                    startInput.value = local.toISOString().slice(0,16);
                } else {
                    startInput.value = "";
                }

            } else {
                startInput.value = "";   // 🔥 If no config → keep empty
            }

            settingsLoadedOnce = true;

                            // duration.value = d.duration || "";
                            // passMark.value = d.passMark || "";
                            // enabled.checked = d.enabled || false;

                            // if(d.startTime){
                            //     const dt = new Date(d.startTime);
                            //     if(!isNaN(dt)){
                            //         start.value = dt.toISOString().slice(0,16);
                            //     }
                            // }

                            // settingsLoadedOnce = true;
        }

        updateStatusLight(d);

    })
    .catch(err=>{
        console.log("Refresh error:",err);
    });
}


/* ============================
   LOGIN
============================ */
function login(){

    password = document.getElementById("pass").value;

    fetch(SCRIPT_URL + "?mode=admin&password=" + password)
    .then(r=>r.json())
    .then(d=>{

        if(d.error){
            alert("Wrong Password");
            return;
        }

        loginBox.style.display="none";
        panel.style.display="block";

        settingsLoadedOnce = false;

        loadDashboard();

        if(refreshInterval)
            clearInterval(refreshInterval);

        refreshInterval =
            setInterval(loadDashboard,3000);
    });
}


/* ============================
   STATUS LIGHT
============================ */
function updateStatusLight(data){

    const light = document.getElementById("statusLight");

    // No config or disabled
    if(!data.enabled || !data.startTime || !data.duration){
        light.style.background = "#9e9e9e"; // GREY
        return;
    }

    const now   = new Date();
    const start = new Date(data.startTime);
    const end   = new Date(start.getTime() + data.duration * 60000);

    if(now < start){
        light.style.background = "#9e9e9e"; // NOT STARTED → GREY
    }
    else if(now >= start && now <= end){
        light.style.background = "#66ff00"; // RUNNING → GREEN
    }
    else{
        light.style.background = "#ff2b2b"; // TIMEOUT → RED
    }
}



/* ============================
   UPDATE SETTINGS
============================ */
function update(){

    const formData = new URLSearchParams();

    formData.append("type","UPDATE_CONFIG");
    formData.append("password",password);
    formData.append("duration",duration.value);
    formData.append("startTime",start.value);
    formData.append("enabled",enabled.checked);
    formData.append("passMark",passMark.value);

    fetch(SCRIPT_URL,{
        method:"POST",
        body:formData
    })
    .then(()=>{

        alert("Settings Updated");

        settingsLoadedOnce = false;
        loadDashboard();

    })
    .catch(err=>{
        console.log("Update error:",err);
    });
}


/* ============================
   ENTER KEY LOGIN
============================ */
document.getElementById("pass")
.addEventListener("keypress",e=>{
    if(e.key==="Enter") login();
});


function download(){
    window.open("YOUR_SHEET_LINK");
}

</script>

</body>
</html>
